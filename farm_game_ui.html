<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Farm Game UI DEBUG</title>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root{
      --plot-ratio:1 / 0.88;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html, body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      font-family:"Microsoft JhengHei", Arial, sans-serif;
      color:#5b3518;
    }

    button,input{
      font-family:inherit;
    }

    .app{
      width:100%;
      max-width:500px;
      height:100vh;
      margin:0 auto;
      position:relative;
      overflow:hidden;
      background:#000;
    }

    .scroll-area{
      width:100%;
      height:100%;
      overflow-y:auto;
      overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
      background:#000;
    }

    .scroll-area::-webkit-scrollbar{ display:none; }

    .scene{
      width:100%;
      position:relative;
      background:#000;
      margin-bottom:70px;
    }

    .bg-main{
      width:100%;
      display:block;
      pointer-events:none;
    }

    .weather-layer{
      position:absolute;
      inset:0;
      z-index:3;
      pointer-events:none;
      overflow:hidden;
    }

    .weather-layer::before,
    .weather-layer::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
    }

    .weather-layer.rain::before{
      background-image:repeating-linear-gradient(120deg,rgba(255,255,255,.26) 0px,rgba(255,255,255,.26) 1.5px,transparent 1.5px,transparent 9px);
      background-size:90px 140px;
      animation:farmRainMove .42s linear infinite;
      opacity:.62;
    }

    .weather-layer.heavy-rain::before{
      background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.34) 0px,rgba(255,255,255,.34) 2px,transparent 2px,transparent 7px);
      background-size:85px 135px;
      animation:farmRainMove .25s linear infinite;
      opacity:.78;
    }

    @keyframes farmRainMove{
      from{background-position:0 0;}
      to{background-position:-120px 240px;}
    }

    .weather-layer.fog::before{
      background:
        radial-gradient(circle at 22% 34%,rgba(255,255,255,.22),transparent 28%),
        radial-gradient(circle at 80% 28%,rgba(255,255,255,.16),transparent 30%),
        linear-gradient(to bottom,rgba(255,255,255,.12),rgba(255,255,255,.02) 45%,transparent);
      filter:blur(6px);
      opacity:.82;
      animation:farmFogMove 8s ease-in-out infinite alternate;
    }

    @keyframes farmFogMove{
      from{transform:translateX(-2%);}
      to{transform:translateX(2%);}
    }

    .weather-layer.dark::after{
      background:linear-gradient(to bottom,rgba(3,12,45,.52),rgba(0,10,36,.42) 45%,rgba(0,0,20,.36));
    }

    .weather-layer.midnight::after{
      background:linear-gradient(to bottom,rgba(0,4,20,.72),rgba(0,8,28,.62) 45%,rgba(0,0,12,.58));
    }

    .weather-layer.hot::before{
      background:radial-gradient(circle at 82% 12%,rgba(255,241,140,.42),transparent 18%),linear-gradient(to bottom,rgba(255,190,60,.20),rgba(255,230,110,.08) 50%,transparent);
      animation:farmHeatPulse 2.4s ease-in-out infinite alternate;
    }

    .weather-layer.hot::after{
      inset:16% 0 36%;
      background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0px,rgba(255,255,255,.05) 3px,transparent 3px,transparent 13px);
      filter:blur(2px);
      animation:farmHeatWave 1.8s ease-in-out infinite alternate;
      opacity:.65;
    }

    @keyframes farmHeatPulse{
      from{opacity:.65;}
      to{opacity:.95;}
    }

    @keyframes farmHeatWave{
      from{transform:translateX(-4px) skewX(-1deg);}
      to{transform:translateX(5px) skewX(1deg);}
    }

    .weather-layer.lightning{animation:farmLightning 5s infinite;}
    @keyframes farmLightning{
      0%,86%,91%,100%{opacity:1;}
      87%{opacity:.35;}
      88%{opacity:1;}
      89%{opacity:.25;}
      90%{opacity:1;}
    }
    .weather-layer.lightning::after{
      background:rgba(210,230,255,.25);
      opacity:0;
      animation:farmLightningFlash 5s infinite;
    }
    @keyframes farmLightningFlash{
      0%,86%,91%,100%{opacity:0;}
      87%{opacity:.9;}
      88%{opacity:.1;}
      89%{opacity:.75;}
      90%{opacity:0;}
    }

    #farmNightLight{
      position:absolute;
      top:30%;
      left:0;
      width:100%;
      height:70%;
      z-index:0;
      pointer-events:none;
      opacity:0 !important;
      display:none !important;
      background:none !important;
      animation:none !important;
    }

    #farmNightLight.active{ opacity:0 !important; display:none !important; }

    .member-card{
      position:absolute;
      top:.5%;
      left:10.2%;
      width:80%;
      z-index:5;
    }

    .member-info-layer{
      position:absolute;
      top:3.65%;
      left:11.66%;
      width:150%;
      height:8%;
      z-index:7;
      display:grid;
      grid-template-columns:18% 22% 24%;
      align-items:center;
      pointer-events:none;
      color:#dcba67;
      font-weight:1000;
      -webkit-text-stroke:.5px currentColor;
    }

    .avatar-box{
      width:75%;
      aspect-ratio:0.91/1;
      border-radius:50%;
      overflow:hidden;
      background:transparent;
      margin:0 auto;
    }

    .avatar-box img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .member-text{
      padding-left:3px;
      padding-bottom:6px;
      padding-top:1px;
      line-height:1.35;
      transform:translateY(-20px);
    }

    .member-name{
      font-size:24px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      margin-top:10px;
    }

    .member-phone{
      font-size:20px;
      pointer-events:auto;
      cursor:pointer;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      margin-top:24px;
    }

    .member-level{
      width:95%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:visible;
      transform:translate(-42px,-12px);
    }

    .member-level-img{
      width:100%;
      max-width:55%;
      height:70%;
      display:block;
      object-fit:fill;
      transform:translate(1px,-8px);
    }

    .level-progress-slot{
      position:absolute;
      left:17.5%;
      right:49.5%;
      bottom:-15%;
      height:36%;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9;
      transform:translateY(-13px);
    }

    .level-progress-img{
      width:100%;
      height:100%;
      display:block;
      object-fit:fill;
    }

    .point-info-layer{
      position:absolute;
      top:13.8%;
      left:5.5%;
      width:110%;
      height:9.5%;
      z-index:7;
      pointer-events:none;
      color:hwb(214 1% 77%);
      font-weight:900;
      font-size:20px;
      -webkit-text-stroke:.5px currentColor;
    }

    .balance{ position:absolute; left:15%; top:4%; }
    .bonus{ position:absolute; left:15%; top:35%; }
    .game-point{ position:absolute; left:15%; top:67%; }

    .barcode{
      position:absolute;
      left:20%;
      top:25.3%;
      width:75%;
      z-index:7;
      min-height:34px;
    }

    .barcode svg{
      width:80%;
      height:auto;
      display:block;
    }

    #qrcode canvas,
    #qrcode img{
      width:100% !important;
      height:100% !important;
      display:block;
      image-rendering:auto;
    }

    .barcode-empty{
      width:80%;
      min-height:34px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#dcba67;
      font-size:14px;
      font-weight:1000;
      line-height:1.25;
      background:rgba(24,53,42,.78);
      border:1px solid rgba(220,186,103,.55);
      border-radius:6px;
      padding:2px 4px;
    }

    .qrcode{
      position:absolute;
      right:30.45%;
      top:8px;
      width:18%;
      aspect-ratio:1/1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      font-size:11px;
      border:1px solid rgba(220,186,103,.72);
      color:#dcba67;
      background:#18352a;
      box-shadow:inset 0 0 0 2px rgba(220,186,103,.22), 0 2px 6px rgba(10,30,22,.22);
      overflow:visible;
    }

    #qrcode{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#18352a;
      color:#dcba67;
      font-weight:1000;
      border-radius:2px;
      word-break:break-all;
      text-align:center;
      line-height:1.05;
      padding:2px;
    }

    .weather-badge{
      position:absolute;
      top:29.5%;
      left:12%;
      z-index:8;
      pointer-events:none;
      display:flex;
      align-items:center;
      gap:3px;
      background:rgba(0,0,0,.28);
      border-radius:8px;
      padding:0 6px 0 5px;
      color:#38bade;
      font-size:20px;
      font-weight:900;
      line-height:1.4;
      letter-spacing:.5px;
      text-shadow:0 1px 3px rgba(0,0,0,.6);
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
    }

    .road-sign{
      position:absolute;
      top:80%;
      right:3%;
      width:45%;
      z-index:4;
    }

    .road-sign-img{
      width:100%;
      display:block;
    }

    .road-sign-buttons{
      position:absolute;
      inset:0;
      pointer-events:none;
    }

    .road-sign-btn{
      position:absolute;
      left:8%;
      width:82%;
      height:22%;
      border:0;
      background:transparent;
      pointer-events:auto;
    }

    .road-sign-btn.top{ top:8%; }
    .road-sign-btn.middle{ top:27%; }
    .road-sign-btn.bottom{ top:51%; }

    .farm-map-layer{
      position:absolute;
      inset:0;
      z-index:100;
      pointer-events:none;
    }

    .farm{
      position:absolute;
      top:50%;
      left:6%;
      width:88%;
      z-index:1;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:0;
      pointer-events:auto;
    }

    .plot{
      position:relative;
      width:100%;
      margin:0 auto;
      aspect-ratio:var(--plot-ratio);
    }

    .plot img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .plot-progress{
      position:absolute;
      left:18%;
      right:18%;
      bottom:2%;
      height:8px;
      border-radius:999px;
      background:rgba(0,0,0,.25);
      overflow:hidden;
    }

    .plot-progress span{
      display:block;
      height:100%;
      background:rgba(105,190,70,.85);
      width:0%;
    }

    .map-actions{
      position:absolute;
      top:85%;
      left:12%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:24px;
      z-index:22;
      pointer-events:auto;
      width:33.6%;
    }

    .map-action-btn{
      border:0;
      background:transparent;
      padding:0;
      width:100%;
      max-width:316px;
      display:block;
    }

    .map-action-btn.water-btn{
      margin-left:-20px;
    }

    .map-action-btn img{
      width:100%;
      display:block;
    }

    .map-action-btn:active{
      transform:scale(.96);
    }

    .panel-overlay{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.48);
      z-index:9000;
      pointer-events:none;
    }

    .panel-overlay.active{
      display:block;
      pointer-events:auto;
    }

    .map-panel-wrap{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      z-index:10000;
      pointer-events:auto;
      display:none;
      align-items:flex-start;
      justify-content:center;
      padding:6vh 14px 82px;
    }

    .map-panel-wrap.active{
      display:flex;
    }

    .map-panel{
      display:none;
      width:100%;
      max-width:460px;
      max-height:calc(100vh - 148px);
      overflow-y:auto;
      pointer-events:auto;
      position:relative;
      z-index:10001;
      background:#fdf5e8;
      border:1px solid rgba(255,255,255,.8);
      box-shadow:0 12px 40px rgba(54,35,12,.2);
      border-radius:20px;
      padding:12px;
    }

    .map-panel.active{
      display:block;
    }

    .map-panel-close{
      display:block;
      width:100%;
      border:0;
      background:rgba(0,0,0,.08);
      border-radius:12px;
      padding:8px;
      font-size:13px;
      font-weight:900;
      color:#5b3518;
      margin-top:8px;
      cursor:pointer;
    }

    .map-panel-title{
      font-size:13px;
      font-weight:900;
      margin-bottom:6px;
    }

    .map-panel-sub{
      font-size:11px;
      line-height:1.45;
      margin-bottom:6px;
    }

    .map-mini-card{
      background:rgba(255,255,255,.62);
      border-radius:12px;
      padding:8px;
      margin-top:6px;
      font-size:12px;
      line-height:1.45;
      font-weight:800;
    }

    .shop-row,.reward-row,.my-row{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:6px;
      margin-top:6px;
    }

    .shop-item,.reward-item,.my-item,.summary-item{
      background:rgba(255,255,255,.92);
      border-radius:12px;
      padding:7px;
      font-size:11px;
      line-height:1.4;
      font-weight:800;
    }

    .shop-head,.reward-head{
      display:flex;
      align-items:center;
      gap:6px;
      margin-bottom:4px;
    }

    .shop-head img,.reward-head img{
      width:34px;
      height:34px;
      object-fit:contain;
    }

    .shop-actions,.reward-actions{
      display:flex;
      gap:6px;
      margin-top:5px;
    }

    .small-btn{
      flex:1;
      border:0;
      border-radius:10px;
      background:#fff3cb;
      color:#5b3518;
      font-size:11px;
      font-weight:900;
      padding:6px 4px;
    }

    .small-btn.primary{ background:#ffd46e; }
    .small-btn.green{ background:#bce78e; }
    .small-btn:disabled{ opacity:.45; }

    .summary-list{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:6px;
      margin-top:6px;
    }

    .map-nav{
      position:fixed;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:100%;
      max-width:500px;
      z-index:9000;
      pointer-events:auto;
    }

    .map-nav-bg{
      width:100%;
      display:block;
      pointer-events:none;
    }

    .map-nav-buttons{
      position:absolute;
      left:0;
      bottom:0;
      width:100%;
      height:90%;
      display:grid;
      grid-template-columns:repeat(6,1fr);
    }

    .map-nav-btn{
      border:0;
      background:rgba(255,255,255,0);
      width:100%;
      height:100%;
      display:block;
    }

    .map-nav-btn:active{
      transform:scale(.96);
    }

    .msg{
      position:fixed;
      left:50%;
      bottom:16px;
      transform:translateX(-50%);
      width:calc(100vw - 28px);
      max-width:472px;
      background:rgba(0,0,0,.75);
      color:#fff;
      border-radius:14px;
      padding:10px 12px;
      font-size:14px;
      text-align:center;
      z-index:2000;
      display:none;
    }

    .plant-picker{
      position:fixed;
      inset:0;
      z-index:300;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:flex-end;
      justify-content:center;
    }

    .plant-picker.active{ display:flex; }

    .plant-picker-box{
      width:100%;
      max-width:500px;
      background:#fdf3e1;
      border-radius:20px 20px 0 0;
      padding:16px;
      max-height:65vh;
      overflow-y:auto;
    }

    .plant-picker-title{
      font-size:15px;
      font-weight:900;
      margin-bottom:10px;
      color:#5b3518;
    }

    .plant-picker-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
    }

    .plant-picker-item{
      background:rgba(255,255,255,.7);
      border-radius:12px;
      padding:8px;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .plant-picker-item img{
      width:40px;
      height:40px;
      object-fit:contain;
    }

    .plant-picker-info{
      flex:1;
      font-size:12px;
      font-weight:800;
      color:#5b3518;
      line-height:1.5;
    }

    .plant-picker-btn{
      border:0;
      background:#ffd46e;
      border-radius:10px;
      font-size:12px;
      font-weight:900;
      padding:6px 10px;
      color:#5b3518;
      cursor:pointer;
    }

    .plant-picker-btn:disabled{ opacity:.4; }

    .plant-picker-cancel{
      margin-top:10px;
      width:100%;
      border:0;
      background:#e8d8c0;
      border-radius:12px;
      padding:10px;
      font-size:14px;
      font-weight:900;
      color:#5b3518;
      cursor:pointer;
    }

    #lineUserIdDebug{
      display:block !important;
      position:fixed !important;
      top:0 !important;
      left:0 !important;
      right:0 !important;
      min-height:120px !important;
      z-index:2147483647 !important;
      background:rgba(0,0,0,.88) !important;
      color:#00ff90 !important;
      font-size:12px !important;
      line-height:1.5 !important;
      padding:10px 12px !important;
      border:4px solid yellow !important;
      white-space:pre-wrap !important;
      word-break:break-all !important;
      overflow:auto !important;
      max-height:38vh !important;
    }

    @media (max-height:720px){
      .map-panel{
        max-height:60vh;
        padding:7px;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="scroll-area" id="scrollArea">
    <div class="scene" id="scene">
      <img
        class="bg-main"
        id="bgMain"
        src="https://pub-e41c0e5930434282a405e422bcc59113.r2.dev/FARM%20Game%20UI/bgs/01_farm_morning.png"
        alt="背景"
      >
      <div class="weather-layer" id="weatherLayer"></div>

      <img
        class="member-card"
        src="https://pub-e41c0e5930434282a405e422bcc59113.r2.dev/MemberAndPointCard.png"
        onclick="onMemberCardClick()"
        style="cursor:pointer;"
        alt="會員卡"
      >

      <div class="member-info-layer">
        <div class="avatar-box" id="memberAvatar"></div>

        <div class="member-text">
          <div class="member-name" id="memberName">載入中</div>
          <div class="member-phone" id="memberPhone" onclick="onUnboundPhoneClick(event)">輸入電話加入</div>
        </div>

        <div class="member-level">
          <img
            id="memberLevelImg"
            class="member-level-img"
            src="https://pub-e41c0e5930434282a405e422bcc59113.r2.dev/FARM%20Game%20UI//lEVELsplit_1.png"
            alt="Lv.1"
          >
        </div>

        <div class="level-progress-slot">
          <img
            id="levelProgressImg"
            class="level-progress-img"
            src="https://pub-e41c0e5930434282a405e422bcc59113.r2.dev/FARM%20Game%20UI/%E7%AD%89%E7%B4%9A%E9%80%B2%E5%BA%A6%E6%A2%9D0%25.png"
            alt="升級進度 0%"
          >
        </div>
      </div>

      <div class="point-info-layer">
        <div class="balance" id="memberBalance">儲值金：$0</div>
        <div class="bonus" id="memberBonus">紅利金：$0</div>
        <div class="game-point" id="memberPoint">遊戲點：0 點</div>
        <div class="qrcode" id="qrcodeWrap">
          <div id="qrcode">QR</div>
        </div>
        <div id="qrcodeId" style="position:absolute;right:30.85%;top:77.4%;width:18%;z-index:8;font-size:16px;color:#dcba67;font-weight:900;text-align:center;letter-spacing:0.5px;line-height:1.2;transform:translateX(2px);">ANG0603</div>
      </div>

      <div class="barcode" id="barcode"><svg id="barcodeSvg"></svg></div>

      <div id="lineUserIdDebug">debug loading...</div>

      <div class="weather-badge" id="weatherBadge">
        <span id="weatherBadgeText">📍埔里鎮 一般 25°C ☀️</span>
      </div>

      <div class="road-sign">
        <img class="road-sign-img" src="https://pub-e41c0e5930434282a405e422bcc59113.r2.dev/FARM%20Game%20UI/%E6%9C%AA%E5%91%BD%E5%90%8D%E8%A8%AD%E8%A8%88%20(31).png" alt="路牌">
        <div class="road-sign-buttons">

async function loadIdentityFromLiff(){
  appendDebug("開始 loadIdentityFromLiff()");
  appendDebug("LIFF_ID = " + LIFF_ID);
  appendDebug("location.href = " + location.href);
  appendDebug("location.origin = " + location.origin);
  appendDebug("userAgent = " + navigator.userAgent);

  if(!(window.liff && LIFF_ID)){
    appendDebug("LIFF not available");
    return { ok:false, message:"LIFF not available" };
  }

  try{
    appendDebug("liff object exists = yes");

    try{
      appendDebug("liff.isInClient() = " + liff.isInClient());
    }catch(err){
      appendDebug("liff.isInClient() error = " + (err && err.message ? err.message : String(err)));
    }

    appendDebug("準備 liff.init...");

    const initStart = Date.now();

    await liff.init({
      liffId: LIFF_ID,
      withLoginOnExternalBrowser: true
    });

    appendDebug("liff.init 完成，耗時(ms) = " + (Date.now() - initStart));

    try{
      await Promise.race([
        liff.ready,
        new Promise(function(_, reject){
          setTimeout(function(){
            reject(new Error("liff.ready timeout"));
          }, 10000);
        })
      ]);
      appendDebug("liff.ready 完成");
    }catch(err){
      appendDebug("liff.ready 失敗 = " + (err && err.message ? err.message : String(err)));
    }

    let loggedIn = false;
    try{
      loggedIn = liff.isLoggedIn();
      appendDebug("liff.isLoggedIn = " + loggedIn);
    }catch(err){
      appendDebug("liff.isLoggedIn error = " + (err && err.message ? err.message : String(err)));
    }

    if(!loggedIn){
      appendDebug("未登入，準備 liff.login()");
      liff.login({ redirectUri: location.href });
      return { ok:false, message:"redirect_to_login" };
    }

    let userId = "";
    let displayName = "";
    let pictureUrl = "";

    try{
      const context = liff.getContext();
      appendDebug("liff.getContext() = " + JSON.stringify(context || {}));
      userId = context && context.userId ? context.userId : "";
    }catch(err){
      appendDebug("liff.getContext 失敗 = " + (err && err.message ? err.message : String(err)));
    }

    try{
      const profile = await liff.getProfile();
      appendDebug("liff.getProfile() = " + JSON.stringify(profile || {}));
      userId = userId || profile.userId || "";
      displayName = profile.displayName || "";
      pictureUrl = profile.pictureUrl || "";
    }catch(err){
      appendDebug("liff.getProfile 失敗 = " + (err && err.message ? err.message : String(err)));
    }

    if(!userId){
      appendDebug("LIFF 無法取得 userId");
      return { ok:false, message:"LIFF 無法取得 userId" };
    }

    APP.line_user_id = userId;
    APP.line_name = displayName || "";
    APP.line_picture = pictureUrl || "";

    appendDebug("LIFF 取得身份成功");
    appendDebug("APP.line_user_id = " + APP.line_user_id);
    appendDebug("APP.line_name = " + APP.line_name);
    appendDebug("APP.line_picture = " + (APP.line_picture ? "(有圖)" : "(空)"));

    return {
      ok:true,
      line_user_id:userId,
      line_name:APP.line_name,
      line_picture:APP.line_picture
    };
  }catch(err){
    appendDebug("loadIdentityFromLiff 外層 catch");
    appendDebug("error message = " + (err && err.message ? err.message : String(err)));
    appendDebug("error name = " + (err && err.name ? err.name : ""));
    appendDebug("error stack = " + (err && err.stack ? err.stack : ""));
    return { ok:false, message: err && err.message ? err.message : String(err) };
  }
}

function attachLineIdentity(payload){
  payload = payload || {};

  const uid = APP.line_user_id || payload.line_user_id || payload.userId || payload.uid || payload.userid || "";
  if(uid){
    payload.line_user_id = uid;
    payload.userId = uid;
    payload.uid = uid;
    payload.userid = uid;
  }

  const lineName = APP.line_name || payload.line_name || payload.displayName || payload.name || "";
  if(lineName){
    payload.line_name = lineName;
    payload.displayName = lineName;
    payload.name = lineName;
  }

  if(APP.line_picture && !payload.line_picture){
    payload.line_picture = APP.line_picture;
    payload.pictureUrl = APP.line_picture;
    payload.picture_url = APP.line_picture;
  }

  return payload;
}

function showMsg(text){

  el.textContent = text || "";

  clearTimeout(window.__msgTimer);

    el.style.display = "none";
  }, 2200);
}

function api(action,payload){
  payload = attachLineIdentity(payload || {});
  payload.action = action;

  return new Promise(function(resolve){
    if(!(window.google && google.script && google.script.run)){
      resolve({
        ok:false,
        message:"此版本要放在 Google Apps Script HTML Service 執行，不能直接用 GitHub Pages 開啟"
      });
      return;
    }

    let done = false;
    const timer = setTimeout(function(){
      if(done) return;
      done = true;
      resolve({ ok:false, message:"API 逾時，請稍後再試" });
    }, 60000);

    google.script.run
      .withSuccessHandler(function(res){
        if(done) return;
        done = true;
        clearTimeout(timer);
        resolve(res || { ok:false, message:"後端沒有回傳資料" });
      })
      .withFailureHandler(function(err){
        if(done) return;
        done = true;
        clearTimeout(timer);
        resolve({ ok:false, message: err && err.message ? err.message : String(err) });
      })
      .memberSystemApi(action, payload);
  });
}

function clampLevel_(level){
  level = Number(level || 1);
  if(isNaN(level) || level < 1) level = 1;
  if(level > 18) level = 18;
  return Math.floor(level);
}

function setLevelImage(level){
  const img = document.getElementById("memberLevelImg");
  if(!img) return;

  const lv = clampLevel_(level);
  const urls = [
    BASE + "/lEVELsplit_" + lv + ".png",
    BASE + "lEVELsplit_" + lv + ".png",
    BASE + "/lEVELsplit_1.png",
    BASE + "lEVELsplit_1.png"
  ];

  let i = 0;
  img.style.display = "block";
  img.alt = "Lv." + lv;
  img.onerror = function(){
    i++;
    if(i < urls.length){
      img.src = urls[i];
      return;
    }
    img.onerror = null;
    img.style.display = "none";
  };
  img.src = urls[0];
}

function levelProgressPercent(){
  const f = APP.farm || {};
  const lv = Number(f.level || 1);
  const xp = Number(f.xp || 0);
  const need = lv * 100;
  return Math.max(0, Math.min(100, Math.floor((xp / need) * 100)));
}

function levelProgressImgSrc(percent){
  percent = Number(percent || 0);
  if(isNaN(percent)) percent = 0;

  let step = 0;
  if(percent >= 100) step = 100;
  else if(percent >= 80) step = 80;
  else if(percent >= 60) step = 60;
  else if(percent >= 40) step = 40;
  else if(percent >= 20) step = 20;

  return BASE + "%E7%AD%89%E7%B4%9A%E9%80%B2%E5%BA%A6%E6%A2%9D" + step + "%25.png";
}

function createEmptyPlot(){

    crop:"",
    stage:0,
    progress:0,
    dead:false,
    ready:false,
    plantedAt:"",
    lastWaterDate:""
  };
}

function getDefaultWeather(){
  return { text:"一般", tempC:25, rainMm:0, fallback:true };
}

function normalizeWeather(w){
  w = w || {};
  const text = String(w.text || "").trim();
  const tempC = Number(w.tempC);
  const rainMm = Number(w.rainMm || 0);

  if(!text || text === "讀取中" || text === "載入中"){
    return getDefaultWeather();
  }

  return {
    text:text,
    tempC:isNaN(tempC) ? 25 : tempC,
    rainMm:isNaN(rainMm) ? 0 : rainMm,
    fallback:!!w.fallback
  };
}

function normalizeFarm(){
  if(!APP.farm) APP.farm = {};

  if(!Array.isArray(APP.farm.plots)) APP.farm.plots = [];
  while(APP.farm.plots.length < FARM_TOTAL) APP.farm.plots.push(createEmptyPlot());
  if(APP.farm.plots.length > FARM_TOTAL) APP.farm.plots = APP.farm.plots.slice(0, FARM_TOTAL);
  APP.farm.plots = APP.farm.plots.map(function(p){ return Object.assign(createEmptyPlot(), p || {}); });

  if(!APP.farm.level) APP.farm.level = 1;
  if(APP.farm.xp === undefined) APP.farm.xp = 0;
  if(!APP.farm.harvestCount) APP.farm.harvestCount = {};
  if(!APP.farm.rewardStamps) APP.farm.rewardStamps = {};
  if(!APP.farm.coupons) APP.farm.coupons = {};
  APP.farm.weather = normalizeWeather(APP.farm.weather);
  if(!APP.inventory || typeof APP.inventory !== "object") APP.inventory = {};

  Object.keys(DEFAULT_CROPS).forEach(function(key){
    if(APP.inventory[key] === undefined) APP.inventory[key] = 0;
    if(APP.farm.harvestCount[key] === undefined) APP.farm.harvestCount[key] = 0;
    if(APP.farm.rewardStamps[key] === undefined) APP.farm.rewardStamps[key] = 0;
    if(APP.farm.coupons[key] === undefined) APP.farm.coupons[key] = 0;
  });
}

function renderPhoneBarcode(phoneVal){
  const barcodeWrap = document.getElementById("barcode");
  if(!barcodeWrap) return;

  const cleanPhone = String(phoneVal || "").trim();

  if(!cleanPhone){
    barcodeWrap.innerHTML = '<div class="barcode-empty">輸入電話加入</div>';
    return;
  }

  barcodeWrap.innerHTML = '<svg id="barcodeSvg"></svg>';
  const nextSvg = document.getElementById("barcodeSvg");

  if(window.JsBarcode && nextSvg){
    try{
      JsBarcode(nextSvg, cleanPhone, {
        format:"CODE128",
        displayValue:false,

async function submitPhone(){
  if(APP.isSubmittingPhone) return;
  APP.isSubmittingPhone = true;

  const phoneVal = (document.getElementById("phoneInput") || {}).value || "";
  const msgEl = document.getElementById("phoneMsg");
  if(msgEl) msgEl.textContent = "";

  const btn = document.querySelector("#panelPhone button[onclick='submitPhone()']");

  try{
    appendDebug("submitPhone() 開始，輸入電話 = " + phoneVal);

    if(!phoneVal.trim()){
      if(msgEl) msgEl.textContent = "請輸入電話號碼";
      appendDebug("電話空白，停止");
      return;
    }

    if(btn){
      btn.disabled = true;
      btn.textContent = "處理中...";
    }

    const bindPayload = {
      line_user_id: APP.line_user_id || "",
      userId: APP.line_user_id || "",
      userid: APP.line_user_id || "",
      line_name: APP.line_name || "LINE會員",
      name: APP.line_name || "LINE會員",
      phone: phoneVal.trim(),
      phone_input: phoneVal.trim(),
      source: "farm_bind_phone_only"
    };

    appendDebug("linkByPhone payload = " + JSON.stringify(bindPayload));

    const res = APP.line_user_id
      ? await api("linkByPhone", bindPayload)
      : await api("bindLineMember", bindPayload);

    appendDebug("linkByPhone response = " + JSON.stringify(res || {}));

    if(!res || !res.ok){
      if(msgEl) msgEl.textContent = (res && res.message) || "綁定失敗，請重試";
      appendDebug("綁定失敗");
      return;
    }

    absorbBackendBootstrap(res);
    APP.need_phone = false;
    appendDebug("absorbBackendBootstrap(linkByPhone) 完成");

    const reloadRes = await reload(true);
    appendDebug("綁定後 reload 結果 = " + JSON.stringify(reloadRes || {}));

    if(!reloadRes || !reloadRes.ok){
      renderAll();
      appendDebug("reload 失敗，退回 renderAll()");
    }

    setActivePanel("");
    showMsg("✅ 綁定成功！會員編號：" + (getMemberIdValue() || "已建立"));

    appendDebug(
      "綁定後畫面資料" +
      "\n  member_id = " + getMemberIdValue() +
      "\n  phone = " + getMemberPhoneValue()
    );

    if(APP.pendingRedeemCrop){
      const cropKey = APP.pendingRedeemCrop;
      APP.pendingRedeemCrop = "";
      setTimeout(function(){
        redeemReward(cropKey);
      }, 350);
    }
  }finally{
    APP.isSubmittingPhone = false;
    if(btn){
      btn.disabled = false;
      btn.textContent = "輸入電話加入";
    }
  }
}

function renderFarmSummary(){
  const box = document.getElementById("farmSummary");
  const plots = (APP.farm && APP.farm.plots) || [];
  const stats = {};

  Object.keys(DEFAULT_CROPS).forEach(function(key){
    stats[key] = { total:0, ready:0, dead:0, growing:0, progressSum:0 };
  });

  plots.forEach(function(p){
    if(!p || !p.crop || !stats[p.crop]) return;
    stats[p.crop].total++;
    stats[p.crop].progressSum += Number(p.progress || 0);
    if(p.dead) stats[p.crop].dead++;
    else if(p.ready || Number(p.stage || 0) >= 4) stats[p.crop].ready++;
    else stats[p.crop].growing++;
  });

  box.innerHTML = "";

  const plantedTotal = plots.filter(function(p){ return p && p.crop; }).length;
  const stateCard = document.createElement("div");
  stateCard.className = "summary-item";
  stateCard.innerHTML =
    "<b>整體狀況</b><br>" +
    "已種：" + plantedTotal + " 格 / " + FARM_TOTAL + " 格<br>" +
    "等級：" + (APP.farm.level || 1) + "<br>" +
    "升級進度：" + levelProgressPercent() + "%";
  box.appendChild(stateCard);

  Object.keys(DEFAULT_CROPS).forEach(function(key){
    const s = stats[key];
    if(!s.total) return;
    const avg = s.total ? Math.floor(s.progressSum / s.total) : 0;

    const div = document.createElement("div");
    div.className = "summary-item";
    div.innerHTML =
      "<b>" + DEFAULT_CROPS[key].name + "</b><br>" +
      "目前：" + s.total + " 格<br>" +
      "成熟：" + s.ready + "｜生長：" + s.growing + "｜枯萎：" + s.dead + "<br>" +
      "平均進度：" + avg + "%";
    box.appendChild(div);
  });

  if(box.children.length === 1){
    const div = document.createElement("div");
    div.className = "summary-item";
    div.innerHTML = "<b>目前尚未種植</b><br>先到商店買種子，或用庫存直接種植。";
    box.appendChild(div);
  }
}

function buySeed(key, qty){
  qty = Number(qty || 1);

  const crop = APP.crops[key] || DEFAULT_CROPS[key];
  const lv = Number((APP.farm && APP.farm.level) || 1);

  if(crop.unlockLevel && lv < crop.unlockLevel){
    showMsg("等級不足，需要 Lv." + crop.unlockLevel);
    return;
  }

  api("shopBuy", {
    line_user_id: APP.line_user_id,
    crop: key,
    qty: qty
  }).then(function(res){
    appendDebug("shopBuy response = " + JSON.stringify(res || {}));
    if(res && res.ok){
      if(res.farm) APP.farm = res.farm;
      if(res.inventory) APP.inventory = res.inventory;
      if(APP.member && res.newPoint !== undefined){
        APP.member.point = res.newPoint;
        APP.member.points = res.newPoint;
      }
      renderAll();
      showMsg(res.message || ("已購買 " + crop.name + " × " + qty));
      return;
    }
    showMsg((res && res.message) || "購買失敗");
  });
}

  }).then(function(res){

      APP.farm = res.farm || APP.farm;
      renderAll();

function showPlantPicker(index){
  const picker = document.getElementById("plantPicker");
  const grid = document.getElementById("plantPickerGrid");
  grid.innerHTML = "";
  const lv = Number((APP.farm && APP.farm.level) || 1);

  Object.keys(DEFAULT_CROPS).forEach(function(key){
    const crop = APP.crops[key] || DEFAULT_CROPS[key];
    const count = Number(APP.inventory[key] || 0);
    const locked = !!(crop.unlockLevel && lv < crop.unlockLevel);

    const item = document.createElement("div");
    item.className = "plant-picker-item";

    const img = document.createElement("img");
    img.src = cropItemSrc(key);

    const info = document.createElement("div");
    info.className = "plant-picker-info";
    info.innerHTML = crop.name + "<br>庫存：" + count + (locked ? "<br><span style='color:#c44;font-size:11px;'>需 Lv." + crop.unlockLevel + "</span>" : "");

    const btn = document.createElement("button");
    btn.className = "plant-picker-btn";
    btn.textContent = "種植";
    btn.disabled = count <= 0 || locked;
    btn.onclick = function(){
      closePlantPicker();
      doPlant(index, key);
    };

    item.appendChild(img);
    item.appendChild(info);
    item.appendChild(btn);
    grid.appendChild(item);
  });

  picker.classList.add("active");
}

function closePlantPicker(){
  document.getElementById("plantPicker").classList.remove("active");
}

function pickerBackdropClick(e){
  if(e.target === document.getElementById("plantPicker")) closePlantPicker();
}

async function doPlant(index, key){
  const crop = APP.crops[key] || DEFAULT_CROPS[key];
  const count = Number(APP.inventory[key] || 0);

  if(count <= 0){
    showMsg(crop.name + " 庫存不足，請先到商店購買");
    setActivePanel("shop");
    return;
  }

  const res = await api("plant", {
    line_user_id: APP.line_user_id,
    crop: key,
    plotIndex: index
  });

  appendDebug("plant response = " + JSON.stringify(res || {}));

  if(!res.ok){
    showMsg(res.message || "種植失敗");
    return;
  }

  APP.farm = res.farm || APP.farm;
  if(res.inventory) APP.inventory = res.inventory;
  APP.selectedCrop = key;
  renderAll();
  showMsg(crop.name + " 種植成功");
}

    line_name: APP.line_name || "讀取中",
    line_user_id: APP.line_user_id || "",
    userId: APP.line_user_id || "",
    uid: APP.line_user_id || "",
    userid: APP.line_user_id || "",
    line_picture: APP.line_picture || "",
    phone_raw:"",
    phone_normalized:"",
    phone:"",
    phone_member:"",
    member_id:"",
    id:"",
    point:320,
    points:320,
    balance:0,
    bonus:0
  };
  APP.farm = {
    level:1,
    xp:0,
    plots:Array.from({ length:FARM_TOTAL }, function(){ return createEmptyPlot(); }),
    harvestCount:{},
    rewardStamps:{},
    coupons:{},
    weather:getDefaultWeather()
  };
  APP.crops = JSON.parse(JSON.stringify(DEFAULT_CROPS));
  APP.offers = {};
  APP.inventory = {};
}

function absorbBackendBootstrap(res){
  res = res || {};
  const m = res.member || {};

  const uid = res.line_user_id || m.line_user_id || m.userId || m.uid || m.userid || APP.line_user_id || "";
  const lineName = res.line_name || m.line_name || m.name || m.displayName || APP.line_name || "";
  const linePicture = res.line_picture || m.line_picture || m.pictureUrl || m.picture_url || APP.line_picture || "";

  APP.line_user_id = uid;
  APP.line_name = lineName || "";
  APP.line_picture = linePicture || "";

  APP.member = Object.assign({}, APP.member || {}, m, {
    line_user_id: uid,
    userId: uid,
    uid: uid,
    userid: uid,
    line_name: lineName,
    name: m.name || lineName,
    displayName: m.displayName || lineName,
    line_picture: linePicture,
    pictureUrl: linePicture,
    picture_url: linePicture,
    member_id: m.member_id || m.id || res.member_id || "",
    id: m.id || m.member_id || res.member_id || "",
    phone_raw: m.phone_raw || m.phone || m.phone_member || m.phone_normalized || "",
    phone_normalized: m.phone_normalized || "",
    phone: m.phone || m.phone_raw || m.phone_member || m.phone_normalized || "",
    phone_member: m.phone_member || m.phone_normalized || "",
    point: Number(m.point !== undefined ? m.point : (m.points !== undefined ? m.points : (res.point || 0))),
    points: Number(m.points !== undefined ? m.points : (m.point !== undefined ? m.point : (res.point || 0)))
  });

  APP.farm = res.farm || APP.farm || {};
  APP.need_phone = !!res.need_phone;
  APP.crops = Object.assign({}, DEFAULT_CROPS, res.crops || {});
  APP.offers = res.offers || {};
  APP.inventory = res.inventory || {};

  appendDebug(
    "absorbBackendBootstrap()" +
    "\n  uid = " + (APP.line_user_id || "(空)") +
    "\n  line_name = " + (APP.line_name || "(空)") +
    "\n  member_id = " + (getMemberIdValue() || "(空)") +
    "\n  phone = " + (getMemberPhoneValue() || "(空)")
  );
}

async function loadIdentityFromSession(){
  if(APP.line_user_id || !FARM_SESSION_ID) return { ok:true, skipped:true };

  appendDebug("開始 loadIdentityFromSession()，sid = " + FARM_SESSION_ID);

  const s = await api("getFarmSession", {
    sid: FARM_SESSION_ID,
    token: FARM_SESSION_ID,
    session_id: FARM_SESSION_ID
  });

  appendDebug("getFarmSession response = " + JSON.stringify(s || {}));

  if(!s || !s.ok) return s || { ok:false, message:"登入資料讀取失敗" };

  APP.line_user_id = s.line_user_id || s.userId || s.uid || s.userid || "";
  APP.line_name = s.line_name || APP.line_name || "";
  APP.line_picture = s.line_picture || APP.line_picture || "";

  buildLocalBootstrap();
  renderAll();
  return s;
}

async function reload(silent){
  appendDebug("呼叫 getFarmBootstrap...");
  dumpIdentityDebug("reload() 前身份");

  const payload = {
    line_user_id: APP.line_user_id,
    userId: APP.line_user_id,
    uid: APP.line_user_id,
    userid: APP.line_user_id,
    sid: FARM_SESSION_ID,
    line_name: APP.line_name,
    line_picture: APP.line_picture
  };

  appendDebug("getFarmBootstrap payload = " + JSON.stringify(payload));

  const res = await api("getFarmBootstrap", payload);

  appendDebug("getFarmBootstrap response = " + JSON.stringify(res || {}));

  if(!res || !res.ok){
    APP.localMode = false;
    appendDebug("getFarmBootstrap 失敗：" + ((res && res.message) || "讀取失敗"));
    if(!silent){
      buildLocalBootstrap();
      renderAll();
      showMsg((res && res.message) || "讀取後端資料失敗");
    }
    return res || { ok:false, message:"讀取失敗" };
  }

  APP.localMode = false;
  absorbBackendBootstrap(res);
  dumpIdentityDebug("absorbBackendBootstrap 後身份");

  if(!silent) APP.activePanel = "";
  renderAll();

  appendDebug(
    "reload 完成" +
    "\n  member_id = " + getMemberIdValue() +
    "\n  phone = " + getMemberPhoneValue()
  );

  return res;
}

async function init(){
  setDebug("init() 開始");

  APP.line_user_id = FARM_DIRECT_UID || "";
  APP.line_name = FARM_DIRECT_NAME || "";
  APP.line_picture = FARM_DIRECT_PICTURE || "";

  appendDebug("網址參數讀取完成");
  dumpIdentityDebug("初始身份");

  buildLocalBootstrap();
  renderAll();
  appendDebug("buildLocalBootstrap() / renderAll() 完成");

  if(!APP.line_user_id){
    appendDebug("沒有 direct uid，開始走 LIFF");
    const liffRes = await loadIdentityFromLiff();

    if(liffRes && liffRes.message === "redirect_to_login"){
      appendDebug("LIFF 要求登入，等待跳轉");
      return;
    }

    if(liffRes && liffRes.ok){
      appendDebug("LIFF 成功拿到 userId");
      dumpIdentityDebug("LIFF 後身份");
    }else{
      appendDebug("LIFF 失敗：" + ((liffRes && liffRes.message) || "未知錯誤"));
    }
  } else {
    appendDebug("已有 direct uid，不走 LIFF");
  }

  if(!APP.line_user_id && FARM_SESSION_ID){
    appendDebug("LIFF 沒拿到，改走 sid session");
    const sessionRes = await loadIdentityFromSession();

    if(!sessionRes || !sessionRes.ok){
      appendDebug("session 失敗：" + ((sessionRes && sessionRes.message) || "未知錯誤"));
      showMsg((sessionRes && sessionRes.message) || "登入資料讀取失敗，請從 LINE / LIFF 重新進入");
      return;
    }

    appendDebug("session 成功");
    dumpIdentityDebug("session 後身份");
  }

  if(!APP.line_user_id){
    appendDebug("最終仍然沒有 userId");
    showMsg("請從 LINE / LIFF 重新進入農場");
    return;
  }

  appendDebug("準備 reload(true)");
  const res = await reload(true);

  if(res && res.ok){
    appendDebug("init() 完成，資料OK");
  }else{
    appendDebug("init() 完成，但資料讀取失敗：" + ((res && res.message) || "未知錯誤"));
    showMsg((res && res.message) || "資料讀取失敗");
  }
}

init();
</script>
