<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Farmmember</title>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root{
      --plot-ratio:1 / 0.88;
      --qr-dark:#f0dc8a;
      --qr-light:#18352a;
    }
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }
    html, body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      font-family:"Microsoft JhengHei", Arial, sans-serif;
      color:#5b3518;
    }
    button,input{
      font-family:inherit;
    }
    .app{
      width:100%;
      max-width:500px;
      height:100vh;
      margin:0 auto;
      position:relative;
      overflow:hidden;
      background:#000;
    }
    .scroll-area{
      width:100%;
      height:100%;
      overflow-y:auto;
      overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
      background:#000;
    }
    .scroll-area::-webkit-scrollbar{ display:none; }
    .scene{
      width:100%;
      position:relative;
      background:#000;
      margin-bottom:70px;
    }
    .bg-main{
      width:100%;
      display:block;
      pointer-events:none;
    }
    .weather-layer{
      position:absolute;
      inset:0;
      z-index:3;
      pointer-events:none;
      overflow:hidden;
    }
    .weather-layer::before,
    .weather-layer::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
    }
    .weather-layer.rain::before{
      background-image:repeating-linear-gradient(120deg,rgba(255,255,255,.26) 0px,rgba(255,255,255,.26) 1.5px,transparent 1.5px,transparent 9px);
      background-size:90px 140px;
      animation:farmRainMove .42s linear infinite;
      opacity:.62;
    }
    .weather-layer.heavy-rain::before{
      background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.34) 0px,rgba(255,255,255,.34) 2px,transparent 2px,transparent 7px);
      background-size:85px 135px;
      animation:farmRainMove .25s linear infinite;
      opacity:.78;
    }
    @keyframes farmRainMove{
      from{background-position:0 0;}
      to{background-position:-120px 240px;}
    }
    .weather-layer.fog::before{
      background:
        radial-gradient(circle at 22% 34%,rgba(255,255,255,.22),transparent 28%),
        radial-gradient(circle at 80% 28%,rgba(255,255,255,.16),transparent 30%),
        linear-gradient(to bottom,rgba(255,255,255,.12),rgba(255,255,255,.02) 45%,transparent);
      filter:blur(6px);
      opacity:.82;
      animation:farmFogMove 8s ease-in-out infinite alternate;
    }
    @keyframes farmFogMove{
      from{transform:translateX(-2%);}
      to{transform:translateX(2%);}
    }
    .weather-layer.dark::after{
      background:linear-gradient(to bottom,rgba(3,12,45,.52),rgba(0,10,36,.42) 45%,rgba(0,0,20,.36));
    }
    .weather-layer.midnight::after{
      background:linear-gradient(to bottom,rgba(0,4,20,.72),rgba(0,8,28,.62) 45%,rgba(0,0,12,.58));
    }
    .weather-layer.hot::before{
      background:radial-gradient(circle at 82% 12%,rgba(255,241,140,.42),transparent 18%),linear-gradient(to bottom,rgba(255,190,60,.20),rgba(255,230,110,.08) 50%,transparent);
      animation:farmHeatPulse 2.4s ease-in-out infinite alternate;
    }
    .weather-layer.hot::after{
      inset:16% 0 36%;
      background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0px,rgba(255,255,255,.05) 3px,transparent 3px,transparent 13px);
      filter:blur(2px);
      animation:farmHeatWave 1.8s ease-in-out infinite alternate;
      opacity:.65;
    }
    @keyframes farmHeatPulse{
      from{opacity:.65;}
      to{opacity:.95;}
    }
    @keyframes farmHeatWave{
      from{transform:translateX(-4px) skewX(-1deg);}
      to{transform:translateX(5px) skewX(1deg);}
    }
    .weather-layer.lightning{animation:farmLightning 5s infinite;}
    @keyframes farmLightning{
      0%,86%,91%,100%{opacity:1;}
      87%{opacity:.35;}
      88%{opacity:1;}
      89%{opacity:.25;}
      90%{opacity:1;}
    }
    .weather-layer.lightning::after{
      background:rgba(210,230,255,.25);
      opacity:0;
      animation:farmLightningFlash 5s infinite;
    }
    @keyframes farmLightningFlash{
      0%,86%,91%,100%{opacity:0;}
      87%{opacity:.9;}
      88%{opacity:.1;}
      89%{opacity:.75;}
      90%{opacity:0;}
    }

    #farmNightLight{
      position:absolute;
      top:30%;
      left:0;
      width:100%;
      height:70%;
      z-index:0;
      pointer-events:none;
      opacity:0 !important;
      display:none !important;
      background:none !important;
      animation:none !important;
    }
    #farmNightLight.active{ opacity:0 !important; display:none !important; }

    .member-card{
      position:absolute;
      top:.5%;
      left:10.2%;
      width:80%;
      z-index:5;
    }
    .member-info-layer{
      position:absolute;
      top:3.65%;
      left:11.66%;
      width:150%;
      height:8%;
      z-index:7;
      display:grid;
      grid-template-columns:18% 22% 24%;
      align-items:center;
      pointer-events:none;
      color:#dcba67;
      font-weight:1000;
      -webkit-text-stroke:.5px currentColor;
    }
    .avatar-box{
      width:75%;
      aspect-ratio:0.91/1;
      border-radius:50%;
      overflow:hidden;
      background:transparent;
      margin:0 auto;
    }
    .avatar-box img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .member-text{
      padding-left:3px;
      padding-bottom:6px;
      padding-top:1px;
      line-height:1.35;
      transform:translateY(-20px);
    }
    .member-name{
      font-size:24px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      margin-top:10px;
    }
    .member-phone{
      font-size:20px;
      pointer-events:auto;
      cursor:pointer;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      margin-top:24px;
    }
    .member-level{
      width:95%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:visible;
      transform:translate(-42px,-12px);
      pointer-events:auto;
    }
    .member-level-img{
      width:100%;
      max-width:55%;
      height:70%;
      display:block;
      object-fit:fill;
      transform:translate(1px,-8px);
      cursor:pointer;
    }
    .level-progress-slot{
      position:absolute;
      left:17.5%;
      right:49.5%;
      bottom:-15%;
      height:36%;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9;
      transform:translateY(-13px);
    }
    .level-progress-img{
      width:100%;
      height:100%;
      display:block;
      object-fit:fill;
    }
    .point-info-layer{
      position:absolute;
      top:13.8%;
      left:5.5%;
      width:110%;
      height:9.5%;
      z-index:7;
      pointer-events:none;
      color:hwb(214 1% 77%);
      font-weight:900;
      font-size:20px;
      -webkit-text-stroke:.5px currentColor;
    }
    .balance{ position:absolute; left:15%; top:4%; }
    .bonus{ position:absolute; left:15%; top:35%; }
    .game-point{ position:absolute; left:15%; top:67%; }

    .barcode{
      position:absolute;
      left:20%;
      top:25.3%;
      width:75%;
      z-index:7;
      min-height:20px;
    }
    .barcode svg{
      width:62%;
      height:auto;
      display:block;
    }
    .barcode-empty{
      width:62%;
      min-height:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#dcba67;
      font-size:12px;
      font-weight:1000;
      line-height:1.25;
      background:rgba(24,53,42,.78);
      border:1px solid rgba(220,186,103,.55);
      border-radius:6px;
      padding:2px 4px;
    }

    .qrcode{
      position:absolute;
      right:30.45%;
      top:8px;
      width:18%;
      aspect-ratio:1/1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      font-size:11px;
      border:1px solid rgba(220,186,103,.72);
      color:#dcba67;
      background:#18352a;
      box-shadow:inset 0 0 0 2px rgba(220,186,103,.22), 0 2px 6px rgba(10,30,22,.22);
      overflow:visible;
    }
    #qrcode{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#18352a;
      color:#dcba67;
      font-weight:1000;
      border-radius:2px;
      word-break:break-all;
      text-align:center;
      line-height:1.05;
      padding:2px;
    }
    #qrcode canvas,
    #qrcode img{
      width:100% !important;
      height:100% !important;
      display:block;
      image-rendering:pixelated;
      background:#18352a !important;
    }

    .weather-badge{
      position:absolute;
      top:29.5%;
      left:12%;
      z-index:8;
      pointer-events:none;
      display:flex;
      align-items:center;
      gap:3px;
      background:rgba(0,0,0,.28);
      border-radius:8px;
      padding:0 6px 0 5px;
      color:#38bade;
      font-size:20px;
      font-weight:900;
      line-height:1.4;
      letter-spacing:.5px;
      text-shadow:0 1px 3px rgba(0,0,0,.6);
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
    }

    .road-sign{
      position:absolute;
      top:80%;
      right:3%;
      width:45%;
      z-index:4;
    }
    .road-sign-img{
      width:100%;
      display:block;
    }
    .road-sign-buttons{
      position:absolute;
      inset:0;
      pointer-events:none;
    }
    .road-sign-btn{
      position:absolute;
      left:8%;
      width:82%;
      height:22%;
      border:0;
      background:transparent;
      pointer-events:auto;
    }
    .road-sign-btn.top{ top:8%; }
    .road-sign-btn.middle{ top:27%; }
    .road-sign-btn.bottom{ top:51%; }

    .farm-map-layer{
      position:absolute;
      inset:0;
      z-index:100;
      pointer-events:none;
    }
    .farm{
      position:absolute;
      top:50%;
      left:6%;
      width:88%;
      z-index:1;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:0;
      pointer-events:auto;
    }
    .plot{
      position:relative;
      width:100%;
      margin:0 auto;
      aspect-ratio:var(--plot-ratio);
    }
    .plot img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }
    .plot-progress{
      position:absolute;
      left:18%;
      right:18%;
      bottom:2%;
      height:8px;
      border-radius:999px;
      background:rgba(0,0,0,.25);
      overflow:hidden;
    }
    .plot-progress span{
      display:block;
      height:100%;
      background:rgba(105,190,70,.85);
      width:0%;
    }

    .map-actions{
      position:absolute;
      top:85%;
      left:12%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:24px;
      z-index:22;
      pointer-events:auto;
      width:33.6%;
    }
    .map-action-btn{
      border:0;
      background:transparent;
      padding:0;
      width:100%;
      max-width:316px;
      display:block;
    }
    .map-action-btn.water-btn{
      margin-left:-20px;
    }
    .map-action-btn img{
      width:100%;
      display:block;
    }
    .map-action-btn:active{
      transform:scale(.96);
    }

    .panel-overlay{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.48);
      z-index:9000;
      pointer-events:none;
    }
    .panel-overlay.active{
      display:block;
      pointer-events:auto;
    }
    .map-panel-wrap{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      z-index:10000;
      pointer-events:auto;
      display:none;
      align-items:flex-start;
      justify-content:center;
      padding:6vh 14px 82px;
    }
    .map-panel-wrap.active{
      display:flex;
    }
    .map-panel{
      display:none;
      width:100%;
      max-width:460px;
      max-height:calc(100vh - 148px);
      overflow-y:auto;
      pointer-events:auto;
      position:relative;
      z-index:10001;
      background:#fdf5e8;
      border:1px solid rgba(255,255,255,.8);
      box-shadow:0 12px 40px rgba(54,35,12,.2);
      border-radius:20px;
      padding:12px;
    }
    .map-panel.active{
      display:block;
    }
    .map-panel-close{
      display:block;
      width:100%;
      border:0;
      background:rgba(0,0,0,.08);
      border-radius:12px;
      padding:8px;
      font-size:13px;
      font-weight:900;
      color:#5b3518;
      margin-top:8px;
      cursor:pointer;
    }
    .map-panel-title{
      font-size:13px;
      font-weight:900;
      margin-bottom:6px;
    }
    .map-panel-sub{
      font-size:11px;
      line-height:1.45;
      margin-bottom:6px;
    }
    .map-mini-card{
      background:rgba(255,255,255,.62);
      border-radius:12px;
      padding:8px;
      margin-top:6px;
      font-size:12px;
      line-height:1.45;
      font-weight:800;
    }
    .shop-row,.reward-row,.my-row{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:6px;
      margin-top:6px;
    }
    .shop-item,.reward-item,.my-item,.summary-item{
      background:rgba(255,255,255,.92);
      border-radius:12px;
      padding:7px;
      font-size:11px;
      line-height:1.4;
      font-weight:800;
    }
    .shop-head,.reward-head{
      display:flex;
      align-items:center;
      gap:6px;
      margin-bottom:4px;
    }
    .shop-head img,.reward-head img{
      width:34px;
      height:34px;
      object-fit:contain;
    }
    .shop-actions,.reward-actions{
      display:flex;
      gap:6px;
      margin-top:5px;
    }
    .small-btn{
      flex:1;
      border:0;
      border-radius:10px;
      background:#fff3cb;
      color:#5b3518;
      font-size:11px;
      font-weight:900;
      padding:6px 4px;
    }
    .small-btn.primary{ background:#ffd46e; }
    .small-btn:disabled{ opacity:.45; }

    .summary-list{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:6px;
      margin-top:6px;
    }
    .map-nav{
      position:fixed;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:100%;
      max-width:500px;
      z-index:9000;
      pointer-events:auto;
    }
    .map-nav-bg{
      width:100%;
      display:block;
      pointer-events:none;
    }
    .map-nav-buttons{
      position:absolute;
      left:0;
      bottom:0;
      width:100%;
      height:90%;
      display:grid;
      grid-template-columns:repeat(6,1fr);
    }
    .map-nav-btn{
      border:0;
      background:rgba(255,255,255,0);
      width:100%;
      height:100%;
      display:block;
    }
    .map-nav-btn:active{
      transform:scale(.96);
    }

    .msg{
      position:fixed;
      left:50%;
      bottom:16px;
      transform:translateX(-50%);
      width:calc(100vw - 28px);
      max-width:472px;
      background:rgba(0,0,0,.75);
      color:#fff;
      border-radius:14px;
      padding:10px 12px;
      font-size:14px;
      text-align:center;
      z-index:2000;
      display:none;
    }

    .plant-picker{
      position:fixed;
      inset:0;
      z-index:300;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:flex-end;
      justify-content:center;
    }
    .plant-picker.active{ display:flex; }
    .plant-picker-box{
      width:100%;
      max-width:500px;
      background:#fdf3e1;
      border-radius:20px 20px 0 0;
      padding:16px;
      max-height:65vh;
      overflow-y:auto;
    }
    .plant-picker-title{
      font-size:15px;
      font-weight:900;
      margin-bottom:10px;
      color:#5b3518;
    }
    .plant-picker-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
    }
    .plant-picker-item{
      background:rgba(255,255,255,.7);
      border-radius:12px;
      padding:8px;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .plant-picker-item img{
      width:40px;
      height:40px;
      object-fit:contain;
    }
    .plant-picker-info{
      flex:1;
      font-size:12px;
      font-weight:800;
      color:#5b3518;
      line-height:1.5;
    }
    .plant-picker-btn{
      border:0;
      background:#ffd46e;
      border-radius:10px;
      font-size:12px;
      font-weight:900;
      padding:6px 10px;
      color:#5b3518;
      cursor:pointer;
    }
    .plant-picker-btn:disabled{ opacity:.4; }
    .plant-picker-cancel{
      margin-top:10px;
      width:100%;
      border:0;
      background:#e8d8c0;
      border-radius:12px;
      padding:10px;
      font-size:14px;
      font-weight:900;
      color:#5b3518;
      cursor:pointer;
    }

    #lineUserIdDebug{
      display:none;
      position:fixed;
      top:8px;
      left:8px;
      right:8px;
      z-index:2147483647;
      background:rgba(0,0,0,.88);
      color:#00ff90;
      font-size:12px;
      line-height:1.5;
      padding:10px 12px;
      border:2px solid rgba(255,230,80,.95);
      border-radius:12px;
      white-space:pre-wrap;
      word-break:break-all;
      overflow:auto;
      max-height:38vh;
      box-shadow:0 6px 20px rgba(0,0,0,.35);
    }
    #lineUserIdDebug.show{
      display:block;
    }

    @media (max-height:720px){
      .map-panel{
        max-height:60vh;
        padding:7px;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="scroll-area" id="scrollArea">
    <div class="scene" id="scene">
      <img class="bg-main" id="bgMain" src="https://pub-e41c0e5930434282a405e422bcc59113.r2.dev/FARM%20Game%20UI/bgs/01_farm_morning.png" alt="背景">
      <div class="weather-layer" id="weatherLayer"></div>

      <img class="member-card" src="https://pub-e41c0e5930434282a405e422bcc59113.r2.dev/MemberAndPointCard.png" onclick="onMemberCardClick()" style="cursor:pointer;" alt="會員卡">

      <div class="member-info-layer">
        <div class="avatar-box" id="memberAvatar"></div>

        <div class="member-text">
          <div class="member-name" id="memberName">載入中</div>
          <div class="member-phone" id="memberPhone" onclick="onUnboundPhoneClick(event)">輸入電話加入</div>
        </div>

        <div class="member-level">
          <img
            id="memberLevelImg"
            class="member-level-img"
            src="https://pub-e41c0e5930434282a405e422bcc59113.r2.dev/FARM%20Game%20UI//lEVELsplit_1.png"
            alt="Lv.1"
            onclick="toggleDebugPanel(event)"
          >
        </div>

        <div class="level-progress-slot">
          <img id="levelProgressImg" class="level-progress-img" src="https://pub-e41c0e5930434282a405e422bcc59113.r2.dev/FARM%20Game%20UI/%E7%AD%89%E7%B4%9A%E9%80%B2%E5%BA%A6%E6%A2%9D0%25.png" alt="升級進度 0%">
        </div>
      </div>

      <div class="point-info-layer">
        <div class="balance" id="memberBalance">儲值金：$0</div>
        <div class="bonus" id="memberBonus">紅利金：$0</div>
        <div class="game-point" id="memberPoint">遊戲點：0 點</div>
        <div class="qrcode" id="qrcodeWrap"><div id="qrcode">QR</div></div>
        <div id="qrcodeId" style="position:absolute;right:30.85%;top:77.4%;width:18%;z-index:8;font-size:16px;color:#dcba67;font-weight:900;text-align:center;letter-spacing:0.5px;line-height:1.2;transform:translateX(2px);">ANG0000</div>
      </div>

      <div class="barcode" id="barcode"><svg id="barcodeSvg"></svg></div>

      <div id="lineUserIdDebug" aria-hidden="true">debug loading...</div>

      <div class="weather-badge" id="weatherBadge">
        <span id="weatherBadgeText">📍埔里鎮 一般 25°C ☀️</span>
      </div>

      <div class="road-sign">
        <img class="road-sign-img" src="https://pub-e41c0e5930434282a405e422bcc59113.r2.dev/FARM%20Game%20UI/%E6%9C%AA%E5%91%BD%E5%90%8D%E8%A8%AD%E8%A8%88%20(31).png" alt="路牌">

const FARM_SESSION_ID = getParam("sid") || getParam("token") || getParam("session_id");
const FARM_DIRECT_UID = getParam("uid") || getParam("line_user_id") || getParam("userId") || getParam("userid");

const FARM_DIRECT_PICTURE = getParam("line_picture") || getParam("pictureUrl") || "";

const _DEFAULT_AVATAR_URL = "https://pub-e41c0e5930434282a405e422bcc59113.r2.dev/FARM%20Game%20UI/bgs/%E9%A0%AD%E5%83%8F.png";

const STORE_INFO = {

const DEFAULT_CROPS = {

};

function getParam(name){
  try{
    return new URLSearchParams(location.search).get(name) || "";
  }catch(err){
    return "";
  }
}

function setDebug(msg){
  const el = document.getElementById("lineUserIdDebug");
  if(!el) return;
  el.textContent = String(msg || "");
}

function appendDebug(msg){
  const el = document.getElementById("lineUserIdDebug");
  if(!el) return;
  const time = new Date().toLocaleTimeString();
  el.textContent += (el.textContent ? "\n" : "") + "[" + time + "] " + String(msg || "");

  const text = String(msg || "").toLowerCase();
  if(text.indexOf("失敗") >= 0 || text.indexOf("error") >= 0 || text.indexOf("找不到") >= 0){
    el.classList.add("show");
  }
}

function toggleDebugPanel(event){
  if(event && event.stopPropagation) event.stopPropagation();
  const el = document.getElementById("lineUserIdDebug");
  if(!el) return;
  el.classList.toggle("show");
}

function dumpIdentityDebug(title){
  appendDebug(
    title +
    "\n  APP.line_user_id = " + (APP.line_user_id || "(空)") +
    "\n  APP.line_name = " + (APP.line_name || "(空)") +
    "\n  APP.line_picture = " + (APP.line_picture ? "(有圖)" : "(空)")
  );
}

async function loadIdentityFromLiff(){
  appendDebug("開始 loadIdentityFromLiff()");
  if(!(window.liff && LIFF_ID)){
    appendDebug("LIFF not available");
    return { ok:false, message:"LIFF not available" };
  }

  try{
    await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser:true });
    appendDebug("liff.init 完成");

    if(!liff.isLoggedIn()){
      appendDebug("未登入，準備 liff.login()");
      liff.login({ redirectUri: location.href });
      return { ok:false, message:"redirect_to_login" };
    }

    let userId = "";
    let displayName = "";
    let pictureUrl = "";

    try{
      const context = liff.getContext();
      userId = context && context.userId ? context.userId : "";
      appendDebug("liff.getContext ok");
    }catch(err){
      appendDebug("liff.getContext 失敗：" + (err.message || String(err)));
    }

    try{
      const profile = await liff.getProfile();
      userId = userId || profile.userId || "";
      displayName = profile.displayName || "";
      pictureUrl = profile.pictureUrl || "";
      appendDebug("liff.getProfile ok");
    }catch(err){
      appendDebug("liff.getProfile 失敗：" + (err.message || String(err)));
    }

    if(!userId){
      return { ok:false, message:"LIFF 無法取得 userId" };
    }

    APP.line_user_id = userId;
    APP.line_name = displayName || "";
    APP.line_picture = pictureUrl || "";

    dumpIdentityDebug("LIFF 取得身份成功");
    return {
      ok:true,
      line_user_id:userId,
      line_name:APP.line_name,
      line_picture:APP.line_picture
    };
  }catch(err){
    appendDebug("loadIdentityFromLiff 失敗：" + (err.message || String(err)));
    return { ok:false, message: err.message || String(err) };
  }
}

function attachLineIdentity(payload){
  payload = payload || {};
  const uid = APP.line_user_id || payload.line_user_id || payload.userId || payload.uid || payload.userid || "";
  if(uid){
    payload.line_user_id = uid;
    payload.userId = uid;
    payload.uid = uid;
    payload.userid = uid;
  }
  const lineName = APP.line_name || payload.line_name || payload.displayName || payload.name || "";
  if(lineName){
    payload.line_name = lineName;
    payload.displayName = lineName;
    payload.name = lineName;
  }
  if(APP.line_picture && !payload.line_picture){
    payload.line_picture = APP.line_picture;
    payload.pictureUrl = APP.line_picture;
    payload.picture_url = APP.line_picture;
  }
  return payload;
}

async function api(action, payload) {
  payload = attachLineIdentity(payload || {});
  payload.action = action;

  appendDebug("API request action = " + action);
  appendDebug("API request payload = " + JSON.stringify(payload));

  try {
    const res = await fetch(GAS_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payload)
    });

    const text = await res.text();
    appendDebug("API raw response = " + text);

    try {
      return JSON.parse(text);
    } catch (err) {
      return {
        ok: false,
        message: "API 回傳不是合法 JSON",
        raw: text
      };
    }
  } catch (err) {
    return {
      ok: false,
      message: err && err.message ? err.message : String(err)
    };
  }
}

function showMsg(text){
  const el = document.getElementById("msg");
  el.textContent = text || "";
  el.style.display = "block";
  clearTimeout(window.__msgTimer);
  window.__msgTimer = setTimeout(function(){
    el.style.display = "none";
  }, 2200);
}

function cropItemSrc(key){ return BASE + key + "_item.png"; }
function stageName(stage){ return ["seed","sprout","young","grow","harvest","dead"][stage] || "seed"; }

function clampLevel_(level){
  level = Number(level || 1);
  if(isNaN(level) || level < 1) level = 1;
  if(level > 18) level = 18;
  return Math.floor(level);
}

function setLevelImage(level){
  const img = document.getElementById("memberLevelImg");
  if(!img) return;
  const lv = clampLevel_(level);
  img.src = BASE + "lEVELsplit_" + lv + ".png";
  img.alt = "Lv." + lv;
}

function levelProgressPercent(){
  const f = APP.farm || {};
  const lv = Number(f.level || 1);
  const xp = Number(f.exp || f.xp || 0);
  const need = lv * 100;
  return Math.max(0, Math.min(100, Math.floor((xp / need) * 100)));
}

function levelProgressImgSrc(percent){
  percent = Number(percent || 0);
  if(isNaN(percent)) percent = 0;
  let step = 0;
  if(percent >= 100) step = 100;
  else if(percent >= 80) step = 80;
  else if(percent >= 60) step = 60;
  else if(percent >= 40) step = 40;
  else if(percent >= 20) step = 20;
  return BASE + "%E7%AD%89%E7%B4%9A%E9%80%B2%E5%BA%A6%E6%A2%9D" + step + "%25.png";
}

function createEmptyPlot(){
  return { crop:"", stage:0, progress:0, dead:false, ready:false, plantedAt:"", lastWaterDate:"" };
}

function getDefaultWeather(){
  return { text:"一般", tempC:25, rainMm:0, fallback:true };
}

function normalizeFarm(){
  if(!APP.farm) APP.farm = {};
  if(!Array.isArray(APP.farm.plots)) APP.farm.plots = [];
  while(APP.farm.plots.length < FARM_TOTAL) APP.farm.plots.push(createEmptyPlot());
  APP.farm.plots = APP.farm.plots.slice(0, FARM_TOTAL).map(function(p){ return Object.assign(createEmptyPlot(), p || {}); });
  if(!APP.farm.level) APP.farm.level = 1;
  if(APP.farm.exp === undefined && APP.farm.xp !== undefined) APP.farm.exp = APP.farm.xp;
  if(APP.farm.exp === undefined) APP.farm.exp = 0;
  if(!APP.farm.harvestCount) APP.farm.harvestCount = {};
  if(!APP.farm.rewardStamps) APP.farm.rewardStamps = {};
  if(!APP.farm.coupons) APP.farm.coupons = {};
  if(!APP.farm.weather) APP.farm.weather = getDefaultWeather();
  if(!APP.inventory || typeof APP.inventory !== "object") APP.inventory = {};
  Object.keys(DEFAULT_CROPS).forEach(function(key){
    if(APP.inventory[key] === undefined) APP.inventory[key] = 0;
    if(APP.farm.harvestCount[key] === undefined) APP.farm.harvestCount[key] = 0;
    if(APP.farm.rewardStamps[key] === undefined) APP.farm.rewardStamps[key] = 0;
    if(APP.farm.coupons[key] === undefined) APP.farm.coupons[key] = 0;
  });
}

function setMode(mode){
  APP.mode = mode;
  const modeText = document.getElementById("modeText");
  if(modeText) modeText.textContent = mode === "harvest" ? "收成" : "種植";
}

function setActivePanel(panel){
  APP.activePanel = panel || "";
  ["panelFarm","panelShop","panelReward","panelMy","panelMore","panelPhone"].forEach(function(id){
    const el = document.getElementById(id);
    if(el) el.classList.remove("active");
  });
  const wrap = document.getElementById("mapPanelWrap");
  const overlay = document.getElementById("panelOverlay");
  if(!panel){
    if(wrap) wrap.classList.remove("active");
    if(overlay) overlay.classList.remove("active");
    return;
  }
  const activeIdMap = { farm:"panelFarm", shop:"panelShop", reward:"panelReward", my:"panelMy", more:"panelMore", phone:"panelPhone" };
  const activeEl = document.getElementById(activeIdMap[panel] || "");
  if(activeEl) activeEl.classList.add("active");
  if(wrap) wrap.classList.add("active");
  if(overlay) overlay.classList.add("active");
}

function navClick(type){
  if(type === "home"){
    setActivePanel("");
    document.getElementById("scrollArea").scrollTo({ top:0, behavior:"smooth" });
    return;
  }
  if(type === "farm") return setActivePanel("farm");
  if(type === "shop") return setActivePanel("shop");
  if(type === "reward") return setActivePanel("reward");
  if(type === "my") return setActivePanel("my");
  if(type === "more") return setActivePanel("more");
}

function openRedeemMap(){ openExternalUrl("https://www.google.com/maps/dir/?api=1&destination=23.9735972%2C120.962768"); }
function openOfficialLine(){ openExternalUrl(SOCIAL_URL); }

function hasMemberPhone(){
  const m = APP.member || {};
  return !!(m.phone || m.phone_raw || m.phone_normalized || m.phone_member);
}
function getMemberPhoneValue(){
  const m = APP.member || {};
  return m.phone || m.phone_raw || m.phone_normalized || m.phone_member || "";
}
function getMemberIdValue(){
  const m = APP.member || {};

}

function renderMember(){
  const m = APP.member || {};
  const f = APP.farm || {};
  const lv = Number(f.level || 1);
  const progress = levelProgressPercent();

  const avatarBox = document.getElementById("memberAvatar");
  const picUrl = m.line_picture || APP.line_picture || "";
  avatarBox.innerHTML = picUrl
    ? '<img src="' + picUrl + '" alt="頭貼" onerror="this.parentNode.innerHTML=window._defaultAvatar">'

  const qrValue = getMemberIdValue();
  document.getElementById("qrcodeId").textContent = qrValue || "未加入";

}

function renderPhoneBarcode(phoneVal){
  const barcodeWrap = document.getElementById("barcode");
  const cleanPhone = String(phoneVal || "").trim();
  if(!cleanPhone){
    barcodeWrap.innerHTML = '<div class="barcode-empty">輸入電話加入</div>';
    return;
  }
  barcodeWrap.innerHTML = '<svg id="barcodeSvg"></svg>';
  const nextSvg = document.getElementById("barcodeSvg");
  if(window.JsBarcode && nextSvg){
    try{
      JsBarcode(nextSvg, cleanPhone, {
        format:"CODE128",
        displayValue:false,
        width:1.2,
        height:24,
        margin:0,
        background:"transparent",
        lineColor:"#1f1208"
      });
      return;
    }catch(e){}
  }
  barcodeWrap.textContent = cleanPhone;
}

function renderMemberQr(memberId){
  const qrEl = document.getElementById("qrcode");
  const value = String(memberId || "").trim();
  qrEl.innerHTML = "";
  if(!value){
    qrEl.textContent = "QR";
    return;
  }
  try{
    new QRCode(qrEl, {
      text:value,
      width:72,
      height:72,
      colorDark:"#f0dc8a",
      colorLight:"#18352a",
      correctLevel:QRCode.CorrectLevel.H
    });
  }catch(e){
    qrEl.textContent = value;
  }
}

function renderFarm(){
  const farm = document.getElementById("farm");
  farm.innerHTML = "";
  normalizeFarm();
  const plots = APP.farm.plots || [];

  for(let i = 0; i < FARM_TOTAL; i++){
    const p = plots[i] || {};
    const div = document.createElement("div");
    const img = document.createElement("img");
    const bar = document.createElement("div");

    div.className = "plot";
    let src = BASE + "empty%20ground.png";
    if(p.crop){
      if(p.dead) src = BASE + p.crop + "_stage_5_dead.png";
      else src = BASE + p.crop + "_stage_" + (p.stage || 0) + "_" + stageName(p.stage || 0) + ".png";
    }

    img.src = src;
    img.onerror = function(){ img.src = BASE + "empty%20ground.png"; };

    bar.className = "plot-progress";
    bar.innerHTML = '<span style="width:' + Number(p.progress || 0) + '%"></span>';
    if(!p.crop) bar.style.display = "none";

    div.onclick = function(){ clickPlot(i); };
    div.appendChild(img);
    div.appendChild(bar);
    farm.appendChild(div);
  }
}

function renderFarmSummary(){
  const box = document.getElementById("farmSummary");
  const plots = (APP.farm && APP.farm.plots) || [];
  const plantedTotal = plots.filter(function(p){ return p && p.crop; }).length;
  box.innerHTML = "";
  const div = document.createElement("div");
  div.className = "summary-item";
  div.innerHTML =
    "<b>整體狀況</b><br>" +
    "已種：" + plantedTotal + " 格 / " + FARM_TOTAL + " 格<br>" +
    "等級：" + (APP.farm.level || 1) + "<br>" +
    "升級進度：" + levelProgressPercent() + "%";
  box.appendChild(div);
}

function renderShop(){

    actions.appendChild(buy1);

function renderReward(){
  const box = document.getElementById("rewardList");
  box.innerHTML = "";
  Object.keys(DEFAULT_CROPS).forEach(function(key){
    const crop = DEFAULT_CROPS[key];
    const div = document.createElement("div");
    div.className = "reward-item";
    div.innerHTML =
      '<div class="reward-head"><img src="' + cropItemSrc(key) + '"><div>' +
      '<div>' + crop.name + '</div>' +
      '<div>兌換券：' + Number(((APP.farm && APP.farm.coupons) || {})[key] || 0) + '</div>' +
      '</div></div>';
    box.appendChild(div);
  });
}

function renderMy(){
  const box = document.getElementById("myCard");
  const m = APP.member || {};
  const f = APP.farm || {};
  box.innerHTML = "";
  [
    ["姓名", APP.line_name || m.line_name || m.name || "LINE會員"],
    ["會員編號", m.member_id || m.id || "-"],
    ["電話", getMemberPhoneValue() || "未綁定"],
    ["目前等級", "Lv." + Number(f.level || 1)],
    ["儲值餘額", "$" + Number(m.wallet_balance || m.balance || 0)],
    ["紅利點數", Number(m.bonus_balance || m.bonus || 0)],
    ["遊戲點數", Number(m.points || m.point || 0)]
  ].forEach(function(item){
    const div = document.createElement("div");
    div.className = "my-item";
    div.innerHTML = "<b>" + item[0] + "</b><br>" + item[1];
    box.appendChild(div);
  });
}

function renderMore(){
  document.getElementById("moreCard").innerHTML =
    '<div style="display:grid;gap:8px;">' +
      '<div><b>遊戲規則說明</b><div style="margin-top:6px;line-height:1.6;">' +
      '1. 到商店購買種子。<br>2. 點空地種植。<br>3. 每天可澆水 1 次。<br>4. 成熟後收成。<br>5. 收成可得經驗值。' +
      '</div></div>' +
      '<div><b>店家資訊</b><div style="margin-top:6px;line-height:1.6;">' +
      '店名：' + STORE_INFO.name + '<br>地址：' + STORE_INFO.address + '<br>電話：' + STORE_INFO.phone + '<br>營業時間：' + STORE_INFO.hours +
      '</div></div>' +
    '</div>';
}

function renderAll(){
  normalizeFarm();
  renderMember();
  renderFarm();
  renderFarmSummary();
  renderShop();
  renderReward();
  renderMy();
  renderMore();

  document.getElementById("modeText").textContent = APP.mode === "harvest" ? "收成" : "種植";
  document.getElementById("cropText").textContent = DEFAULT_CROPS[APP.selectedCrop]?.name || "未選擇";
  document.getElementById("weatherText").textContent = "一般 / 25°C";
}

async function buySeed(key, qty){
  const res = await api("shopBuy", { line_user_id: APP.line_user_id, crop: key, qty: qty });
  if(!res || !res.ok){
    showMsg((res && res.message) || "購買失敗");
    return;
  }
  if(res.data && res.data.farm) APP.farm = res.data.farm;
  if(res.data && res.data.inventory) APP.inventory = res.data.inventory;
  showMsg("購買成功");
  renderAll();
}

async function clickPlot(index){
  if(APP.mode === "harvest"){
    const res = await api("harvest", { line_user_id: APP.line_user_id, plotIndex: index });
    if(!res || !res.ok){
      showMsg((res && res.message) || "收成失敗");
      return;
    }
    if(res.data && res.data.farm) APP.farm = res.data.farm;
    renderAll();
    showMsg("收成成功");
    return;
  }
  const plot = APP.farm.plots[index] || {};
  if(plot.crop){
    showMsg("這格已有作物");
    return;
  }
  showPlantPicker(index);
}

function showPlantPicker(index){
  const picker = document.getElementById("plantPicker");
  const grid = document.getElementById("plantPickerGrid");
  grid.innerHTML = "";
  Object.keys(DEFAULT_CROPS).forEach(function(key){
    const crop = DEFAULT_CROPS[key];
    const count = Number(APP.inventory[key] || 0);
    const item = document.createElement("div");
    item.className = "plant-picker-item";
    item.innerHTML = '<img src="' + cropItemSrc(key) + '"><div class="plant-picker-info">' + crop.name + '<br>庫存：' + count + '</div>';
    const btn = document.createElement("button");
    btn.className = "plant-picker-btn";
    btn.textContent = "種植";
    btn.disabled = count <= 0;
    btn.onclick = function(){ closePlantPicker(); doPlant(index, key); };
    item.appendChild(btn);
    grid.appendChild(item);
  });
  picker.classList.add("active");
}
function closePlantPicker(){ document.getElementById("plantPicker").classList.remove("active"); }
function pickerBackdropClick(e){ if(e.target === document.getElementById("plantPicker")) closePlantPicker(); }

async function doPlant(index, key){
  const res = await api("plant", { line_user_id: APP.line_user_id, crop: key, plotIndex: index });
  if(!res || !res.ok){
    showMsg((res && res.message) || "種植失敗");
    return;
  }
  if(res.data && res.data.farm) APP.farm = res.data.farm;
  if(res.data && res.data.inventory) APP.inventory = res.data.inventory;
  APP.selectedCrop = key;
  renderAll();
  showMsg("種植成功");
}

async function farmWater(){
  const res = await api("water", { line_user_id: APP.line_user_id });
  if(!res || !res.ok){
    showMsg((res && res.message) || "澆水失敗");
    return;
  }
  if(res.data && res.data.farm) APP.farm = res.data.farm;
  renderAll();
  showMsg("澆水成功");
}

function buildLocalBootstrap(){
  APP.member = {
    name: APP.line_name || "LINE會員",
    line_name: APP.line_name || "LINE會員",
    line_user_id: APP.line_user_id || "",
    line_picture: APP.line_picture || "",
    phone:"",
    member_id:"",
    point:0,
    balance:0,
    bonus:0
  };
  APP.farm = {
    level:1,
    exp:0,
    plots:Array.from({ length:FARM_TOTAL }, function(){ return createEmptyPlot(); }),
    coupons:{}
  };
  APP.inventory = {};
}

function absorbOpenFarmResponse(res){
  const data = res && res.data ? res.data : {};
  const m = data.member || {};
  const f = data.farm || {};

  APP.member = {
    member_id: m.member_id || "",
    id: m.member_id || "",
    name: m.name || APP.line_name || "LINE會員",
    line_name: m.line_name || APP.line_name || "LINE會員",
    line_user_id: m.line_user_id || APP.line_user_id || "",
    line_picture: m.line_picture || APP.line_picture || "",
    phone: m.phone || "",
    phone_raw: m.phone_raw || "",
    phone_normalized: m.phone || "",
    point: Number(f.points || 0),
    balance: Number(f.wallet_balance || 0),
    bonus: Number(f.bonus_balance || 0),
    wallet_balance: Number(f.wallet_balance || 0),
    bonus_balance: Number(f.bonus_balance || 0),
    points: Number(f.points || 0)
  };

  APP.farm = {
    level: Number(f.level || 1),
    exp: Number((f.farm_json && f.farm_json.exp) || 0),
    coupons: (f.farm_json && f.farm_json.coupons) || {},
    plots: (f.plots_json || []).map(function(p){
      return {
        crop: p.crop || "",
        stage: Number(p.stage || 0),
        progress: Number(p.progress || 0),
        dead: !!p.dead,
        ready: !!p.ready
      };
    })
  };

  while(APP.farm.plots.length < FARM_TOTAL) APP.farm.plots.push(createEmptyPlot());
}

async function submitPhone(){
  if(APP.isSubmittingPhone) return;
  APP.isSubmittingPhone = true;

  const phoneVal = (document.getElementById("phoneInput") || {}).value || "";
  const msgEl = document.getElementById("phoneMsg");
  if(msgEl) msgEl.textContent = "";

  try{
    if(!phoneVal.trim()){
      if(msgEl) msgEl.textContent = "請輸入電話號碼";
      return;
    }

    const res = await api("bindLineMember", {
      line_user_id: APP.line_user_id,
      line_name: APP.line_name,
      phone: phoneVal.trim(),
      phone_input: phoneVal.trim(),
      source: "farm_bind_phone_only"
    });

    if(!res || !res.ok){
      if(msgEl) msgEl.textContent = (res && res.message) || "綁定失敗";
      return;
    }

    const openFarmRes = await api("open_farm", {
      line_user_id: APP.line_user_id,
      line_name: APP.line_name,
      line_picture: APP.line_picture
    });

    if(openFarmRes && openFarmRes.ok){
      absorbOpenFarmResponse(openFarmRes);
      renderAll();
    }

    setActivePanel("");
    showMsg("綁定成功");
  } finally {
    APP.isSubmittingPhone = false;
  }
}

async function init(){
  setDebug("init() 開始");

  APP.line_user_id = FARM_DIRECT_UID || sessionStorage.getItem("line_user_id") || "";
  APP.line_name = FARM_DIRECT_NAME || sessionStorage.getItem("line_name") || "";
  APP.line_picture = FARM_DIRECT_PICTURE || sessionStorage.getItem("line_picture") || "";

  buildLocalBootstrap();
  renderAll();

  if(!APP.line_user_id){
    const liffRes = await loadIdentityFromLiff();
    if(liffRes && liffRes.message === "redirect_to_login") return;
  }

  if(!APP.line_user_id){
    showMsg("請從 LINE / LIFF 重新進入農場");
    return;
  }

  const res = await api("open_farm", {
    line_user_id: APP.line_user_id,
    line_name: APP.line_name,
    line_picture: APP.line_picture
  });

  if(!res || !res.ok){
    appendDebug("open_farm 失敗 = " + ((res && res.message) || "未知錯誤"));
    showMsg((res && res.message) || "資料讀取失敗");
    return;
  }

  absorbOpenFarmResponse(res);
  renderAll();
  appendDebug("open_farm success");
}

init();
</script>
